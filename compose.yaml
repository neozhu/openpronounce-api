services:
  openpronounce-api:
    image: ghcr.io/OWNER/openpronounce-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # Expose externally only via a hardened reverse proxy (Traefik/Nginx)
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Tune memory limits after measuring on your target CPU host (~4 GiB resident for both checkpoints):
    # deploy:
    #   resources:
    #     reservations:
    #       memory: 4g
    #     limits:
    #       memory: 6g
