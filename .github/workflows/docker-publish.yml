name: Docker Publish (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENPRONOUNCE_IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.OPENPRONOUNCE_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Verify the image before publishing
        run: |
          key=$(openssl rand -hex 24)
          container=$(docker run -d -p 127.0.0.1:8000:8000 \
            -e "OPENPRONOUNCE_API_KEY=$key" "$OPENPRONOUNCE_IMAGE")
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          curl -fsS --retry 45 --retry-all-errors --retry-delay 2 --max-time 5 \
            http://127.0.0.1:8000/health/ready
          page=$(curl -fsS http://127.0.0.1:8000/practice)
          grep -Fq 'id="record"' <<< "$page"
          if [[ "$page" == *"$key"* ]]; then
            echo "Practice HTML contains the runtime API key" >&2
            exit 1
          fi

      - name: Publish Docker image
        run: docker push "$OPENPRONOUNCE_IMAGE"
