[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "openpronounce-api"
version = "0.1.0"
description = "CPU-only FastAPI service wrapping OpenPronounce 1.1.0 for English pronunciation assessment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.2,<1.0.0",
    "openpronounce==1.1.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "torch>=2.5.0,<2.10.0",
    "uvicorn>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "respx>=0.21.1,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openpronounce_api"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "ASYNC",
    "S",
    "RUF",
]
ignore = [
    "S101",  # allow assert in tests (scoped below) and invariants
    "B008",  # FastAPI Depends/File/Form in function defaults
]

[tool.ruff.lint.isort]
known-first-party = ["openpronounce_api", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S603", "RUF001", "ASYNC240"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests requiring downloaded OpenPronounce models",
]
